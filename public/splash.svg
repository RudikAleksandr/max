        opacity: 0.75;
      }
      16.58% {
        transform: translate(106.977px, 0.366px);
        opacity: 0;
      }
      16.59% {
        transform: translate(-33.023px, 67.032px);
        opacity: 0;
      }
      49.71% {
        transform: translate(-33.023px, 67.032px);
        opacity: 0;
      }
      49.72% {
        transform: translate(-33.023px, 67.032px);
        opacity: 0.75;
        animation-timing-function: cubic-bezier(0.33, 0, 0.25, 1);
      }
      66.3% {
        transform: translate(106.977px, 0.366px);
        opacity: 0.75;
      }
      66.31% {
        transform: translate(106.977px, 0.366px);
        opacity: 0;
      }
      66.32% {
        transform: translate(-33.023px, 67.032px);
        opacity: 0;
      }
      100% {
        transform: translate(-33.023px, 67.032px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
        transform: translate(34.833px, 35px) scale(4.66667);
      }

      .shine {
