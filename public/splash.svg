<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <style>
    .logo {
      fill: #d0d0d0;
    }

    .pulse,
    .shine {
      transform-box: view-box;
      transform-origin: 0 0;
      animation-duration: 3.0167s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    .pulse {
      animation-name: pulse;
    }

    .shine {
      animation-name: shine;
    }

    @keyframes pulse {
      0% {
        transform: translate(34.833px, 35px) scale(4.66667);
        animation-timing-function: cubic-bezier(0.699, 0, 0.373, 1);
      }
      8.84% {
        transform: translate(34.833px, 35px) scale(5.23333);
        animation-timing-function: cubic-bezier(0.221, 0, 0.667, 1);
      }
      22.1% {
        transform: translate(34.833px, 35px) scale(4.66667);
      }
      49.72% {
        transform: translate(34.833px, 35px) scale(4.66667);
        animation-timing-function: cubic-bezier(0.699, 0, 0.373, 1);
      }
      58.56% {
        transform: translate(34.833px, 35px) scale(5.23333);
        animation-timing-function: cubic-bezier(0.221, 0, 0.667, 1);
      }
